name: Translate PDF with BabelDOC

on:
  repository_dispatch:
    types: [translate-pdf]

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdf2zh-next
        run: pip install --upgrade pdf2zh-next

      - name: Download PDF from Google Apps Script
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
          FILE_ID: ${{ github.event.client_payload.fileId }}
        run: |
          python3 - << 'EOF'
          import base64, json, os, urllib.request, urllib.parse

          params = urllib.parse.urlencode({
              "secret": os.environ["BRIDGE_SECRET"],
              "fileId": os.environ["FILE_ID"]
          })
          url = f"{os.environ['APPS_SCRIPT_URL']}?{params}"
          req = urllib.request.urlopen(url)
          data = json.loads(req.read().decode("utf-8"))

          if "error" in data:
              raise RuntimeError(data["error"])

          with open("input.pdf", "wb") as f:
              f.write(base64.b64decode(data["base64"]))
          print(f"Downloaded {data['fileName']} ({os.path.getsize('input.pdf')} bytes)")
          EOF

      - name: Run pdf2zh-next (Layout-Preserving Translation)
        run: |
          mkdir -p ./out
          # Try free Google Translate first
          pdf2zh_next input.pdf --lang-in id --lang-out en --google --no-dual --output ./out || true

          # If Google blocked the cloud IP and produced no output PDF, fall back to free Bing Translate
          if [ -z "$(find . -maxdepth 3 -name '*.pdf' ! -name 'input.pdf')" ]; then
            echo "Google translator produced no output; retrying with Bing translator..."
            pdf2zh_next input.pdf --lang-in id --lang-out en --bing --no-dual --output ./out
          fi

      - name: Upload Translated PDF Back to Google Drive
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
          FILE_ID: ${{ github.event.client_payload.fileId }}
          LAST_UPDATED: ${{ github.event.client_payload.lastUpdated }}
          OUTPUT_NAME: ${{ github.event.client_payload.outputName }}
        run: |
          python3 - << 'EOF'
          import base64, glob, json, os, urllib.request

          # Search both ./out and root workspace for any generated PDF other than input.pdf
          candidates = [
              p for p in glob.glob("./**/*.pdf", recursive=True)
              if os.path.basename(p) != "input.pdf"
          ]
          if not candidates:
              raise FileNotFoundError(
                  "No translated PDF generated. Check the 'Run pdf2zh-next' step log above for details."
              )

          translated_path = sorted(candidates)[0]
          print(f"Found translated PDF: {translated_path} ({os.path.getsize(translated_path)} bytes)")

          with open(translated_path, "rb") as f:
              encoded = base64.b64encode(f.read()).decode("utf-8")

          payload = json.dumps({
              "secret": os.environ["BRIDGE_SECRET"],
              "fileId": os.environ["FILE_ID"],
              "lastUpdated": int(os.environ["LAST_UPDATED"]),
              "outputName": os.environ["OUTPUT_NAME"],
              "base64": encoded
          }).encode("utf-8")

          req = urllib.request.Request(
              os.environ["APPS_SCRIPT_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req) as res:
              print("Apps Script response:", res.read().decode("utf-8"))
          EOF
